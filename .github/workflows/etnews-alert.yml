name: etnews-alert

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (UTC 기준, GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # 기사 데이터를 저장소에 커밋하기 위해 필요 (GitHub Pages가 docs/ 를 보여줌)

concurrency:
  group: etnews-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check etnews and notify
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONIOENCODING: utf-8
        run: python etnews_alert.py --once

      - name: Save articles (seen.json, state.json, docs/articles.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json state.json docs/articles.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "update articles [skip ci]"
            git pull --rebase
            git push
          fi
